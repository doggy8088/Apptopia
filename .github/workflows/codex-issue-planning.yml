name: Issue Planning with Codex CLI

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      issue_limit:
        description: "Max number of open issues to inspect"
        required: false
        default: "100"

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-issue-planning
  cancel-in-progress: false

jobs:
  plan-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE_LIMIT: ${{ inputs.issue_limit || '100' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Validate required secrets
        env:
          AZURE_OPENAI_API_KEY_CODEX: ${{ secrets.AZURE_OPENAI_API_KEY_CODEX }}
        run: |
          if [ -z "$AZURE_OPENAI_API_KEY_CODEX" ]; then
            echo "Missing required secret: AZURE_OPENAI_API_KEY_CODEX"
            exit 1
          fi

      - name: Create Codex config for Azure
        run: |
          mkdir -p ~/.codex
          cat <<EOT > ~/.codex/config.toml
          approval_policy = "on-request"
          sandbox_mode   = "workspace-write"

          profile = "aoai"

          [features]
          multi_agent = true
          steer = true

          #####################
          ### Azure Foundry ###
          #####################

          [model_providers.azure]
          name         = "Azure OpenAI"
          base_url     = "https://duotify-ai-foundry.cognitiveservices.azure.com/openai"
          env_key      = "AZURE_OPENAI_API_KEY_CODEX"
          wire_api     = "responses"
          query_params = { api-version = "2025-04-01-preview" }

          [profiles.aoai]
          model_provider          = "azure"
          model                   = "gpt-5.4"
          preferred_auth_method   = "apikey"
          wire_api                = "responses"
          model_reasoning_effort  = "high"
          model_reasoning_summary = "detailed"
          EOT

      - name: Analyze open issues, comment plan/questions, and apply accepted label by confidence
        env:
          AZURE_OPENAI_API_KEY_CODEX: ${{ secrets.AZURE_OPENAI_API_KEY_CODEX }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          codex exec --dangerously-bypass-approvals-and-sandbox --color never "
          你正在 GitHub Actions 中執行，請使用 gh CLI 處理 Issue。
          請自動幫我取得目前 GitHub Repo 所有 Opened issues（最多 $ISSUE_LIMIT 筆），逐一查看每一條 Issue 的規格。
          請先辨識每一條 Issue 的樓主（issue author）以及最後一條留言的作者。
          如果最後一條留言是樓主的留言，就分析整份 Issue 的討論串並回覆。
          如果最後一條留言不是樓主的留言，則跳過這條 Issue，不要回覆。
          對每一條被分析的 Issue，都要先評估「規格完整度信心指數」，分數範圍是 0 到 100（整數）。
          請把信心指數寫進你的 Issue 留言中，格式為：規格完整度信心指數：<分數>/100。
          若開發的需求不夠明確，請直接留言請樓主提供釐清的資訊。
          請不要開始開發每一項需求。
          如果需求已經足夠明確，請先制訂開發計畫，並留言在 Issue 之中。
          當且僅當信心指數 > 90 時，請幫該 Issue 加上 accepted 標籤。
          若信心指數 <= 90，則不要加 accepted 標籤。
          請直接執行，不要輸出額外說明。"
